[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oscal"
# Version is single-sourced from oscal/_version.py — EDIT THE VERSION THERE, not here.
# See [tool.setuptools.dynamic] below, which reads oscal._version.__version__ at build.
dynamic = ["version"]
description = "Python class to validate, convert, query and mutate OSCAL content."
requires-python = ">=3.9"
authors = [{ name = "Brian Ruf", email = "Brian@RufRisk.com" }]
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
keywords = ["oscal", "nist", "security", "compliance", "automation", "ssp", "fedramp", "csf"]

dependencies = [
    "jsonpath-python >= 1.1.5",
    "xmlschema       >= 3.4.3",
    "PyYAML          >= 6.0",
    "markdown        >= 3.0.0",
    "requests        >= 2.31.0",
    "elementpath     >= 4.7.0",
    "packaging       >= 23.1",
]

[project.urls]
Homepage = "https://github.com/brian-ruf/oscal-class"
Repository = "https://github.com/brian-ruf/oscal-class.git"
Documentation = "https://github.com/brian-ruf/oscal-class#readme"
Issues = "https://github.com/brian-ruf/oscal-class/issues"
# Per-version CycloneDX SBOMs are attached to each GitHub Release (see publish.yml).
# This points at the releases list rather than a single version because project.urls is
# static per build and cannot be version-specific; find the SBOM under the matching tag.
SBOM = "https://github.com/brian-ruf/oscal-class/releases"

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-cov",
    "pytest-asyncio",
    "hypothesis",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# FA102 guards the py39 target: it flags PEP 604 (`X | Y`) unions used in
# annotations without `from __future__ import annotations`, which raise at runtime
# on Python 3.9.
select = ["E", "F", "W", "FA102"]
ignore = ["W291", "W293", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Single-source the version: setuptools reads the literal from oscal/_version.py at
# build time. To bump the version, edit oscal/_version.py (not this file).
[tool.setuptools.dynamic]
version = { attr = "oscal._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["oscal*"]
exclude = ["support*", "tests*"]

[tool.setuptools.package-data]
oscal = ["py.typed", "data/*.xml", "data/*.zip"]
