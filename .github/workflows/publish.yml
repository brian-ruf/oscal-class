name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('oscal/_version.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "release tag = $TAG   package version = $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match oscal/_version.py ($PKG). Bump oscal/_version.py or fix the tag."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, sbom]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC trusted publisher

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  sbom:
    name: SBOM and third-party licenses
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to upload assets onto the published Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Builds the CycloneDX SBOM (oscal-<version>.cdx.json) and regenerates
      # THIRD-PARTY-LICENSES.md from the built wheel's runtime closure. The script
      # handles the clean runtime venv + a separate cyclonedx tool venv, so this is the
      # same command you can run locally to test without cutting a release.
      - name: Generate SBOM and license manifest
        run: bash scripts/generate_sbom.sh dist/*.whl

      - name: Attach SBOM and license manifest to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "oscal-${VERSION}.cdx.json" THIRD-PARTY-LICENSES.md --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            oscal-*.cdx.json
            THIRD-PARTY-LICENSES.md

