name: Release

# Triggered by pushing a version tag (vX.Y.Z). Builds the artifact, generates its SBOM,
# and creates the immutable GitHub Release with the wheel, sdist, SBOM, and license
# manifest attached. It does NOT publish to PyPI -- that is a separate, manually dispatched,
# re-runnable workflow (pypi.yml) that uploads the exact assets attached here.
#
# Because this repository uses immutable releases, assets are frozen at publish time, so
# the release is assembled as a draft (mutable) and only sealed (published) once all assets
# are attached. Sealing consumes the version tag; if build/sbom fail, the tag stays reusable.
#
# Release flow for a maintainer: bump oscal/_version.py, merge to main, let CI refresh and
# commit the support database, then: git tag vX.Y.Z && git push origin vX.Y.Z
# (The GitHub Release is created by this workflow; do not create it by hand.)
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('oscal/_version.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "release tag = $TAG   package version = $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match oscal/_version.py ($PKG). Bump oscal/_version.py or fix the tag."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  sbom:
    name: SBOM and third-party licenses
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate SBOM and license manifest
        run: bash scripts/generate_sbom.sh dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            oscal-*.cdx.json
            THIRD-PARTY-LICENSES.md

  github-release:
    name: Create GitHub Release (with SBOM)
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Create immutable release with artifacts + SBOM attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Draft (mutable) -> upload assets -> publish (seals immutably WITH the assets).
          # The wheel + sdist are attached so pypi.yml can publish the exact same artifacts.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            oscal-*.cdx.json THIRD-PARTY-LICENSES.md dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
