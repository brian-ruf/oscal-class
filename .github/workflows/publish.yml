name: Release

# Triggered by pushing a version tag (vX.Y.Z). Builds the artifact, generates its SBOM,
# and creates the immutable GitHub Release with the wheel, sdist, SBOM, and license
# manifest attached. It does NOT publish to PyPI -- that is a separate, manually dispatched,
# re-runnable workflow (pypi.yml) that uploads the exact assets attached here.
#
# Because this repository uses immutable releases, assets are frozen at publish time, so
# the release is assembled as a draft (mutable) and only sealed (published) once all assets
# are attached. Sealing consumes the version tag; if build/sbom fail, the tag stays reusable.
#
# Release flow for a maintainer: bump oscal/_version.py, merge to main, let CI refresh and
# commit the support database, then: git tag vX.Y.Z && git push origin vX.Y.Z
# (The GitHub Release is created by this workflow; do not create it by hand.)
#
# Fallback: if the tag push does not auto-trigger this workflow, run it manually from the
# Actions tab (or `gh workflow run publish.yml -f tag=vX.Y.Z`) against an EXISTING tag. The
# build runs against that tag's commit, identically to the push path.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build the Release for (e.g. v4.2.3). The tag must already exist on the remote."
        required: true
        type: string

# The tag this run operates on: the pushed tag (push event) or the dispatch input.
# On a push event `inputs.tag` is null, so this resolves to github.ref_name (the tag).
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read       # read-only; needed for gh run list on the asset workflows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0    # full history so the stale-tag guard can compare tag..branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('oscal/_version.py').read_text()).group(1))")
          TAG="${RELEASE_TAG#v}"
          echo "release tag = $TAG   package version = $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($RELEASE_TAG) does not match oscal/_version.py ($PKG). Bump oscal/_version.py or fix the tag."
            exit 1
          fi

      # Authoritative timing guard. After a merge, CI Pipeline (support-DB refresh) and Docs
      # (API-doc refresh) push `chore:` commits to the release branch. A tag created before
      # those land would build a wheel with a stale oscal_support.zip. This refuses such a
      # tag regardless of how it was created (scripts/release.sh, a manual `git tag`, or
      # release.sh --force), so a stale release can never be built. It first waits for those
      # workflows to finish on the branch (closing the race where they are still committing),
      # then fails if the branch has newer asset-refresh commits than the tagged commit.
      - name: Guard against a stale tag (assets not yet refreshed on the branch)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: main
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"   # we are checked out at the tagged commit
          # 1) Wait (bounded) for the asset-refresh workflows to finish on the branch.
          deadline=$(( SECONDS + 1200 ))   # 20 minutes
          while :; do
            active=$(gh run list --branch "$RELEASE_BRANCH" --limit 40 \
                       --json status,workflowName \
                       --jq '[.[] | select(.workflowName=="CI Pipeline" or .workflowName=="Docs")
                                  | select(.status=="queued" or .status=="in_progress"
                                           or .status=="requested" or .status=="waiting")] | length')
            [ "$active" -eq 0 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Asset-refresh workflows (CI Pipeline/Docs) still running on $RELEASE_BRANCH after 20m; refusing to build a possibly-stale release."
              exit 1
            fi
            echo "Waiting for CI Pipeline/Docs to finish on $RELEASE_BRANCH ($active active)..."
            sleep 15
          done
          # 2) Fail if the branch has asset-refresh commits newer than the tagged commit.
          git fetch --no-tags origin "$RELEASE_BRANCH"
          PATHS="oscal/data/oscal_support.zip docs/api.html docs/api-llm.html"
          newer=$(git rev-list "${BASE}..origin/${RELEASE_BRANCH}" -- $PATHS || true)
          if [ -n "$newer" ]; then
            echo "::error::Tag ${RELEASE_TAG} predates the post-merge asset refresh on ${RELEASE_BRANCH}. Newer asset commits:"
            git --no-pager log --oneline "${BASE}..origin/${RELEASE_BRANCH}" -- $PATHS
            echo "::error::Delete the tag, wait for ${RELEASE_BRANCH} to settle, then re-tag the refreshed HEAD (scripts/release.sh does this for you)."
            exit 1
          fi
          echo "Stale-tag guard OK: no asset-refresh commits newer than ${RELEASE_TAG} on ${RELEASE_BRANCH}."

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  sbom:
    name: SBOM and third-party licenses
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate SBOM and license manifest
        run: bash scripts/generate_sbom.sh dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            oscal-*.cdx.json
            THIRD-PARTY-LICENSES.md

  github-release:
    name: Create GitHub Release (with SBOM)
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Create immutable release with artifacts + SBOM attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          # Draft (mutable) -> upload assets -> publish (seals immutably WITH the assets).
          # The wheel + sdist are attached so pypi.yml can publish the exact same artifacts.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            oscal-*.cdx.json THIRD-PARTY-LICENSES.md dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
