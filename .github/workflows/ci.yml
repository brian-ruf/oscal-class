name: CI Pipeline

on:
  push:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check oscal/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/unit -v

  # Refreshes the OSCAL support database and API docs on main so that both are
  # current *before* a release is tagged. Runs once, only after every lint and
  # test matrix leg has passed, only for pushes to main (not develop).
  sync-release-assets:
    name: Refresh support data and API docs
    needs: [lint, test]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild OSCAL support database
        run: python oscal/update_support.py --all

      - name: Generate LLM-oriented API docs
        run: python -m oscal.gendocs --mode llm --output docs/api-llm.html

      - name: Generate human-oriented API docs
        run: python -m oscal.gendocs --mode human --output docs/api.html

      - name: Commit refreshed assets if changed
        run: |
          if git diff --quiet -- oscal/data/oscal_support.zip docs/api-llm.html docs/api.html; then
            echo "No changes to support data or API docs; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add oscal/data/oscal_support.zip docs/api-llm.html docs/api.html
            git commit -m "chore: refresh support data and API docs [skip ci]"
            git push origin HEAD:main
          fi
