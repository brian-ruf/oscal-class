name: CI Pipeline

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check oscal/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/unit -v

  # Exercises the exact SBOM + license-manifest generation used at release time, so the
  # pipeline is validated on every push/PR without having to cut a release. It builds a
  # wheel, runs scripts/generate_sbom.sh against it, and uploads the results as workflow
  # artifacts. Non-gating (nothing depends on it) and never touches a Release or PyPI.
  sbom-smoke:
    name: SBOM generation (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SBOM and license manifest (no release)
        run: bash scripts/generate_sbom.sh   # no wheel arg -> builds one, then describes it

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-smoke
          path: |
            oscal-*.cdx.json
            THIRD-PARTY-LICENSES.md

  # Refreshes the OSCAL support database on main so the fresh oscal_support.zip is committed
  # *before* a release is tagged (the release build bundles whatever is in the tagged commit).
  # API-doc generation now lives in docs.yml; this job owns only the support database.
  #
  # Runs only for an actual push landing on main (never a pull_request, whose github.ref is
  # refs/pull/<n>/merge, not refs/heads/main). The shared `main-asset-commit` concurrency
  # group serializes this with docs.yml's commit so the two never push to main concurrently.
  support-data:
    name: Refresh OSCAL support database
    needs: [lint, test]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-asset-commit
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild OSCAL support database
        run: python -m oscal.update_support --all

      - name: Commit refreshed support database if changed
        run: |
          if git diff --quiet -- oscal/data/oscal_support.zip; then
            echo "No support-data changes; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add oscal/data/oscal_support.zip
            git commit -m "chore: refresh OSCAL support database [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
