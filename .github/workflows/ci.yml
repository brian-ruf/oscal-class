name: CI Pipeline

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check oscal/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/unit -v

  # Refreshes the OSCAL support database and API docs on main so that both are
  # current *before* a release is tagged. Runs once, only after every lint and
  # test matrix leg has passed, and only for an actual push landing on main
  # (never for a pull_request run, even one whose base is main -- a PR's
  # github.ref is refs/pull/<n>/merge, never refs/heads/main, but the explicit
  # event_name check makes that intent unambiguous rather than incidental).
  sync-release-assets:
    name: Refresh support data and API docs
    needs: [lint, test]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild OSCAL support database
        run: python oscal/update_support.py --all

      - name: Generate LLM-oriented API docs
        run: python -m oscal.gendocs --mode llm --output docs/api-llm.html

      - name: Generate human-oriented API docs
        run: python -m oscal.gendocs --mode human --output docs/api.html

      - name: Render markdown guides to HTML
        run: python oscal/render_markdown_docs.py

      - name: Commit refreshed assets if changed
        run: |
          if git diff --quiet -- oscal/data/oscal_support.zip docs/*.html; then
            echo "No changes to support data or docs; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add oscal/data/oscal_support.zip docs/*.html
            git commit -m "chore: refresh support data and docs [skip ci]"
            git push origin HEAD:main
          fi

      # Uploaded from this run's own workspace, not re-checked-out from main, so
      # deploy-pages always ships the docs/ this job just generated -- no race
      # with the commit above landing or with GitHub's own branch-watching Pages
      # build (which this Actions-based deployment replaces; see repo Settings ->
      # Pages -> Source: GitHub Actions).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-pages:
    name: Deploy API docs to GitHub Pages
    needs: sync-release-assets
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
