name: CI Pipeline

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and the full test matrix validate every change on develop and in PRs. They are
  # SKIPPED on a push to main (a merge): the code was already linted and tested in the PR,
  # and nothing about the code changes at merge time. Post-merge validation is handled by
  # the support-data job below, which re-runs the unit tests *after* refreshing the support
  # database -- the one thing that is new on main.
  lint:
    name: Ruff lint (Python ${{ matrix.python-version }})
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check oscal/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/unit -v

  # Exercises the exact SBOM + license-manifest generation used at release time, so the
  # pipeline is validated on every push/PR without having to cut a release. Non-gating.
  # Skipped on a push to main (a merge): it was already validated in the PR and does not
  # depend on the support database, so there is nothing new to re-check at merge time.
  sbom-smoke:
    name: SBOM generation (smoke test)
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SBOM and license manifest (no release)
        run: bash scripts/generate_sbom.sh   # no wheel arg -> builds one, then describes it

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-smoke
          path: |
            oscal-*.cdx.json
            THIRD-PARTY-LICENSES.md

  # On a push to main (a merge): rebuild the OSCAL support database, RE-RUN the unit tests
  # against that freshly built database, and commit the refreshed oscal_support.zip only if
  # the tests pass. The test step runs BEFORE the commit step, so a refresh that breaks the
  # tests is never committed to main. Lint and the standalone test matrix are skipped on main
  # (already validated in the PR); the refreshed database is the only thing new here.
  #
  # Shares the main-asset-commit concurrency group with docs.yml so the two main-committing
  # jobs never push concurrently.
  support-data:
    name: Refresh support DB and re-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-asset-commit
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rebuild OSCAL support database
        run: python -m oscal.update_support --all

      - name: Re-run unit tests against the refreshed database
        run: pytest tests/unit -q

      - name: Commit refreshed support database if changed
        run: |
          if git diff --quiet -- oscal/data/oscal_support.zip; then
            echo "No support-data changes; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add oscal/data/oscal_support.zip
            git commit -m "chore: refresh OSCAL support database [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
